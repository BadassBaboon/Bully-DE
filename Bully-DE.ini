; ==============================================================================
; Bully: Scholarship Edition - Definitive Edition (.asi Mod)
; Configuration File
; ==============================================================================

[General]
; Logging verbosity: 0 = Debug, 1 = Info, 2 = Warning, 3 = Error
LogLevel = 1
; Output diagnostic logs to Bully-DE.log next to the .asi
LogToFile = 1

[Shadows]
; Master toggle for shadow enhancements
EnableShadowImprovements = 1

; Shadow map resolution. Vanilla is 1024.
; The engine hard-clamps to 2048 in two places and re-reads a per-light size
; from the light data every frame; the mod lifts the clamp, forces the per-light
; value, and raises NiShadowManager's memory budget to match. Without all three,
; shadow maps fail to allocate mid-scene and lights silently stop casting.
; VRAM per shadow map:  2048 = 16 MB   4096 = 64 MB   8192 = 256 MB
ShadowMapResolution = 8192

; Filtering technique.
; 0 = NiStandardShadowTechnique - hard edges, no filtering. Sharpest, but
;     shadow acne on shallow angles because the depth bias was tuned for PCF.
; 1 = NiPCFShadowTechnique      - vanilla.
; 2 = NiVSMShadowTechnique      - variance shadow maps, softest, light bleed.
ShadowTechnique = 1

; Number of lights that can cast shadow maps at once (vanilla 8).
ShadowGeneratorCount = 8

; NiShadowManager shadow map budget, in MB. 0 = auto (resolution^2 * 4 * 10).
ShadowBudgetMB = 0

; Disable the legacy 2D capsule blob decals under characters and cars.
DisableBlobShadows = 0

; Debug: dump the decrypted Bully.exe image next to this file on every launch.
DumpUnpackedBinary = 0


; Forces all active lights to cast perspective shadows at distance (NiShadowGenerator bit 0x20).
ForceDistanceShadows = 1


[Bloom]
EnableBloomChanges = 1
BloomRadiusPercent = 25
BloomMode = 0
BloomThreshold = -1
BloomStrength = -1
BloomScale = -1


[DrawDistance]
; Master toggle for draw distance enhancements
EnableDrawDistanceChanges = 1

; Multiplier for the distance at which high-detail models switch to LOD meshes.
; 1.0 = vanilla (~150m), 2.0 = 2x (~300m), 3.0 = 3x (~450m).
; Setting 0.0 will switch all objects to lowest LOD meshes (useful for testing/verification).
LodMultiplier = 2.0

; Camera far clip plane in meters.
; 0.0 = automatic (LodMultiplier * 300.0m). Default vanilla is 300.0m.
; You can set an explicit distance like 1200.0 or 1500.0 if desired.
FarClipOverride = 0.0

; Bypass internal early-out distance culling checks to render distant objects.
BypassDistanceCulling = 1

; Force high-detail models everywhere without ever switching to low-detail LOD meshes.
; 0 = normal dynamic LOD switching based on LodMultiplier.
; 1 = forces high LOD meshes regardless of camera distance, never switching down.
ForceHighDetailModels = 0

; Expand pedestrian and vehicle population memory buffers from 490/250 to 2048.
; Prevents NPCs and cars from prematurely despawning when draw distance is raised.
ExtendPedPools = 1

; Pool capacities. Vanilla is 490 pedestrians and 250 vehicles. These are the
; buffers the game allocates; on their own they do not make more NPCs appear,
; they only raise the ceiling. PedPopScale below is what actually asks the game
; to populate more of the map.
PedPoolSize = 2048
VehiclePoolSize = 2048

; Scales the pedestrian spawn and cull ranges the game reads from
; Config\Dat\PedPop.dat, in memory, after the file has been parsed. This is what
; actually populates more of the map; the pool sizes above only raise the
; ceiling. Your own PedPop.dat is still read normally and scaled on top, so a
; custom file keeps working.
;
; Cull ranges and maximum radii scale. The MINIMUM spawn radii are deliberately
; left alone, otherwise NPCs pop in on top of the camera.
;
; 1.0 = off (vanilla). 3.0 is a large but sane increase. Range 1.0 - 6.0.
; Raise PedPoolSize alongside this or the game runs out of ped slots.
PedPopScale = 1.0

; Expand corona / visible light slots from 56 to 1024.
; Distant streetlights, building lamps, and car headlights stay lit across entire districts.
ExtendCoronaBuffer = 1

; Traverses all 1,296 sectors across the map and installs sector buffer bounds guards.
; Prevents crashes when draw distance is raised past vanilla.
EnableSectorOverflowGuard = 1

; Keep distant horizon cliffs, mountains, and landscape terrain visible at all times.
ExtendTerrainDrawDistance = 1

; Filter distant ambient ped blips on the minimap when ped population is raised to 2048.
FilterRadarPedBlips = 0


[AntiAliasing]
; Master toggle for Anti-Aliasing bug fixes when MSAA is enabled (2x, 4x, 8x).
EnableAAFixes = 1


; Fixes white halos / borders around tree foliage, bushes, grass, and wire fences
; by properly activating hardware Alpha-To-Coverage (ATOC / A2M) under MSAA.
FixVegetationOutlines = 1


[Graphics]
; Disables distance fog/haze by preventing fog uniforms from binding to shaders.
; 0 = vanilla fog, 1 = no fog.
DisableDistanceFog = 0

; Disables camera and motion blur by preventing motion blur uniforms from binding to shaders.
; 0 = vanilla blur, 1 = no motion blur.
DisableMotionBlur = 0


[Diagnostics]
; Sample the screen-effect gate state once a second and log it whenever it changes.
LogPostFXState = 0
