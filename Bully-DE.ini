; ==============================================================================
; Bully: Scholarship Edition - Definitive Edition (.asi Mod)
; Configuration File
; ==============================================================================

[General]
; Logging verbosity: 0 = Debug, 1 = Info, 2 = Warning, 3 = Error
LogLevel = 1
; Output diagnostic logs to Bully-DE.log next to the .asi
LogToFile = 1

[Shadows]
; Master toggle for shadow enhancements
EnableShadowImprovements = 1

; Shadow map resolution. Vanilla is 1024.
; The engine hard-clamps to 2048 in two places and re-reads a per-light size
; from the light data every frame; the mod lifts the clamp, forces the per-light
; value, and raises NiShadowManager's memory budget to match. Without all three,
; shadow maps fail to allocate mid-scene and lights silently stop casting.
; VRAM per shadow map:  2048 = 16 MB   4096 = 64 MB   8192 = 256 MB
ShadowMapResolution = 8192

; Filtering technique.
; 0 = NiStandardShadowTechnique - hard edges, no filtering. Sharpest, but
;     shadow acne on shallow angles because the depth bias was tuned for PCF.
; 1 = NiPCFShadowTechnique      - vanilla.
; 2 = NiVSMShadowTechnique      - variance shadow maps, softest, light bleed.
ShadowTechnique = 1

; Number of lights that can cast shadow maps at once (vanilla 8).
; Raising this past 8 is pointless: every compiled shader binds exactly four
; spot-shadow slots (ShadowSpotLight0..3), so a fifth light has nowhere to go.
ShadowGeneratorCount = 8

; NiShadowManager shadow map budget, in MB. 0 = auto (resolution^2 * 4 * 10).
; Auto works out to 640 MB at 4096 and 2560 MB at 8192. If shadows start
; vanishing at distance you are hitting this ceiling or your VRAM limit --
; set an explicit value here or drop the resolution.
ShadowBudgetMB = 0

; Disable the legacy 2D capsule blob decals under characters and cars.
; Characters DO cast real mesh shadows from the spot lights, but the blob is a
; separate ground-contact decal -- turning it off removes contact shadowing on
; surfaces the spot lights do not reach. Leave at 0 unless you want that.
DisableBlobShadows = 0

; Debug: dump the decrypted Bully.exe image next to this file on every launch.
; Only needed when re-deriving addresses in IDA. Writes ~29 MB per boot, and
; overwrites any existing dump that an .i64 database was built from.
DumpUnpackedBinary = 0


[Bloom]
; Bully's bloom is wide rather than undersampled. Both bloom shaders already do
; 13 taps per axis, fully unrolled, so the sample count cannot be raised at
; runtime and raising it would only make the result smoother.
;
; What smears the image is the blur radius: the kernel spaces its taps against
; screen-dimension / 4, giving roughly a 24 pixel reach per axis. This tightens
; that. Only three values are reachable, because the radius comes from a shift.
;
;   100 = vanilla
;    50 = half radius
;    25 = quarter radius
EnableBloomChanges = 1
BloomRadiusPercent = 50

; 0 = leave the game's per-area enable alone
; 1 = force bloom on in every area
; 2 = force bloom off entirely
BloomMode = 0

; Overrides for the values the per-area table supplies. -1 keeps the game's own.
; Stock is threshold 230, strength 80, scale 4.
;
; Threshold is how bright a pixel must be before it blooms, out of 255. At the
; stock 230 only near-white pixels glow at all, so bloom is not what makes the
; overall image look soft -- raise it to ~245 to restrict it further, or lower
; it to spread the effect into midtones.
;
; Strength is the halo's opacity in the final composite, out of 255.
BloomThreshold = -1
BloomStrength = -1
BloomScale = -1


[Diagnostics]
; Sample the screen-effect gate state once a second and log it whenever it
; changes. Reads memory only -- patches nothing, hooks nothing. Turn this on
; when an effect refuses to appear and you need to know which gate is closed.
LogPostFXState = 0
